spring.application.name=Auth-server
server.forward-headers-strategy=framework
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.private-key=${JWT_PRIVATE_KEY}
#
app.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
app.jwt.key-id=${JWT_KEY_ID:test-key}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:8080}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update